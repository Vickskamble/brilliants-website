<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F172A">
<script>
(function () {
  try {
    var saved = localStorage.getItem('brilliants-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>
<meta name="robots" content="noindex, nofollow">
<title>Partner Login — Brilliants</title>
<meta name="description" content="Login to your Brilliants Partner account to access your dashboard, track commissions, and manage referrals.">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" crossorigin>
<style>:root{--primary:#2563EB;--primary-tint:#EFF6FF;--primary-glow:rgba(37,99,235,0.15);--amber:#F59E0B;--amber-tint:#FFFBEB;--amber-ink:#B45309;--green:#10B981;--green-tint:#ECFDF5;--purple:#7C3AED;--purple-tint:#F5F3FF;--rose:#E11D48;--rose-tint:#FFF1F2;--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F8FAFC;--ink:#0F172A;--ink-soft:#475569;--ink-faint:#64748B;--line:#E2E8F0;--line-strong:#CBD5E1;--radius:12px;--radius-sm:8px;--radius-xl:20px;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.1);--shadow-xl:0 16px 48px rgba(0,0,0,0.12);--transition:cubic-bezier(0.4,0,0.2,1);--font-display:"Plus Jakarta Sans",system-ui,sans-serif;--font-body:Inter,system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--nav-h:64px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}a{color:inherit;text-decoration:none}img{max-width:100%;height:auto;display:block}.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius);font-weight:600;font-size:.92rem;transition:all .3s var(--transition);cursor:pointer;border:none;font-family:var(--font-body)}.btn-primary{background:linear-gradient(135deg,var(--primary),#4F46E5);color:#fff;box-shadow:0 4px 16px rgba(37,99,235,0.3)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(37,99,235,0.4)}.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-ghost:hover{background:var(--primary-tint)}

.login-page{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-h));padding:80px 20px 60px;background:linear-gradient(135deg,var(--primary-tint) 0%,var(--bg) 50%,var(--amber-tint) 100%);position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,0.1) 0%,transparent 70%);animation:loginPulse 8s ease-in-out infinite}
.login-page::after{content:'';position:absolute;bottom:-150px;left:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(245,158,11,0.08) 0%,transparent 70%);animation:loginPulse 10s ease-in-out infinite 2s}
@keyframes loginPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}

.login-card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);padding:40px 36px;position:relative;z-index:2;animation:loginSlide .6s var(--transition) both}
@keyframes loginSlide{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),#7C3AED,var(--amber));border-radius:var(--radius-xl) var(--radius-xl) 0 0}

.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.login-logo img{height:40px}
.login-logo-text{font-family:var(--font-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.login-logo-text .half1{color:var(--primary)}
.login-logo-text .half2{color:var(--amber)}

.login-heading{text-align:center;margin-bottom:6px;font-family:var(--font-display);font-weight:800;font-size:1.25rem;color:var(--ink)}
.login-subtext{text-align:center;font-size:.9rem;color:var(--ink-soft);margin-bottom:28px}

.login-form .fg{margin-bottom:18px}
.login-form label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--ink)}
.login-form input{width:100%;padding:12px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);font-family:var(--font-body);font-size:.95rem;background:var(--bg);color:var(--ink);transition:all .2s var(--transition);outline:none}
.login-form input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.login-form input::placeholder{color:var(--ink-faint)}

.login-form .btn-primary{width:100%;justify-content:center;padding:14px 24px;font-size:1rem;margin-top:4px}

.login-error{display:none;padding:12px 16px;background:var(--rose-tint);border:1px solid var(--rose);border-radius:var(--radius-sm);color:var(--rose);font-size:.88rem;font-weight:500;margin-bottom:18px;animation:shakeError .4s ease-out}
@keyframes shakeError{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.login-links{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.login-links a{font-size:.88rem;font-weight:600;color:var(--primary);transition:color .2s}
.login-links a:hover{color:#4F46E5;text-decoration:underline}

.login-footer{text-align:center;margin-top:24px;font-size:.88rem;color:var(--ink-faint)}
.login-footer a{color:var(--primary);font-weight:600}

.login-spinner{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .login-card{margin:0 16px;padding:32px 24px}
  .login-logo-text{font-size:1.3rem}
}
</style>
<link rel="stylesheet" href="/assets/css/style.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/assets/css/enhanced.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/assets/css/style.min.css"><link rel="stylesheet" href="/assets/css/enhanced.min.css"></noscript>
<link rel="icon" href="/assets/images/logo/brilliants-logo-full.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="/assets/js/icons.min.js" defer></script>
<script src="/assets/js/layout.min.js" defer></script>
<script src="/assets/js/enhanced.min.js" defer></script>
<script src="/partner/js/supabase-config.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var session = SupabaseClient.getSession();
  if (session && session.access_token) {
    window.location.href = '/partner/dashboard/';
    return;
  }

  var form = document.getElementById('login-form');
  var emailInput = document.getElementById('login-email');
  var passwordInput = document.getElementById('login-password');
  var submitBtn = document.getElementById('login-btn');
  var errorBox = document.getElementById('login-error');
  var spinner = document.getElementById('login-spinner');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var email = emailInput.value.trim();
    var password = passwordInput.value;

    if (!email || !password) {
      showError('Please enter both email and password.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '';
    spinner.style.display = 'inline-block';
    errorBox.style.display = 'none';

    SupabaseClient.signIn(email, password)
      .then(function(data) {
        if (data.access_token) {
          SupabaseClient.setSession(data);
          window.location.href = '/partner/dashboard/';
        } else if (data.error_description || data.msg) {
          showError(data.error_description || data.msg || 'Login failed. Please try again.');
        } else {
          showError('Login failed. Please check your credentials and try again.');
        }
      })
      .catch(function(err) {
        showError('Something went wrong. Please try again later.');
      })
      .finally(function() {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In<span id="login-spinner" class="login-spinner" style="display:none;margin-left:8px;"></span>';
        spinner = document.getElementById('login-spinner');
      });
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    errorBox.style.animation = 'none';
    errorBox.offsetHeight;
    errorBox.style.animation = 'shakeError .4s ease-out';
  }
});
</script>
</head>
<body>
<a href="#main-content" class="skip-link" style="position:absolute;top:-100px;left:8px;z-index:10000;padding:12px 20px;background:var(--ink);color:#fff;border-radius:0 0 8px 8px;font-weight:600;transition:top 0.2s;">Skip to main content</a>

<div id="nav-placeholder"></div>

<main id="main-content">
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo-text"><span class="half1">Brilliant</span><span class="half2">s</span></span>
      </div>

      <h1 class="login-heading">Partner Login</h1>
      <p class="login-subtext">Access your partner dashboard and manage your referrals.</p>

      <div id="login-error" class="login-error"></div>

      <form id="login-form" class="login-form" autocomplete="on">
        <div class="fg">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" placeholder="you@company.com" required autocomplete="email" aria-label="Email address">
        </div>
        <div class="fg">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password" aria-label="Password">
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary">Sign In<span id="login-spinner" class="login-spinner" style="display:none;margin-left:8px;"></span></button>
      </form>

      <div class="login-links">
        <a href="#" id="forgot-password-link">Forgot password?</a>
        <a href="/partner/register/">New partner? Register</a>
      </div>

      <p class="login-footer">
        Don't have an account yet? <a href="/partner/register/">Apply to become a partner</a>
      </p>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

</body>
</html>
